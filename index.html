<script type="module">
// Basement Empire: a model railway in a basement, seen as a tilt-shift diorama.
// Everything loads from CDNs: three.js from jsDelivr, every model and the stage/clips helpers from Polyfork's free CDN.
// The layout is built in the railway kit's own metres. The basement room is built in real metres and scaled
// up by MODEL_SCALE around it, so the railway parts, their grid and the stage() lighting stay at their native size.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { HueSaturationShader } from 'three/addons/shaders/HueSaturationShader.js';
import { stage } from 'https://polyfork.dev/cdn/stage.mjs';
import { animate } from 'https://polyfork.dev/cdn/clips.mjs';

// ---- tunable numbers ----
const MODEL_SCALE = 32;          // 1:32, roughly gauge 1: one real metre in the basement is 32 layout metres
const TABLE_HEIGHT = 0.95;       // real metres, floor to the top of the baseboard
const BOARD_W = 172, BOARD_D = 72;   // layout metres (about 5.4 x 2.25 m of real table)
const ROOM_W = 11, ROOM_D = 7;   // real metres
const STRAIGHT = 48;             // layout metres of straight track on each side of every oval
const VMAX = 22;                 // layout m/s at full throttle (about 80 scale km/h)
const ACCEL = 3.5;               // layout m/s per second
const COUPLING_GAP = 0.15;       // layout metres between buffer faces
const TILT_BLUR = 5;             // tilt-shift strength in pixels at the top and bottom of the screen

const $ = (id) => document.getElementById(id);
const step = (text) => { $('loadStep').textContent = text; };
// if anything fails to load, say so on the loading screen instead of hanging there
addEventListener('error', (e) => $('loadStep') && step(`Could not load: ${e.message}`));
addEventListener('unhandledrejection', (e) => $('loadStep') && step(`Could not load: ${e.reason?.message ?? e.reason}`));

// ---- renderer, camera, post-processing ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 0.05, 4000);   // narrow lens: reads as a close look at something small
camera.position.set(174, 50.3, 97.8);   // the opening view: low from the garden corner, looking up the table

const look = stage(renderer, scene, { time: 'noon', sky: false, fog: false, shadowSpan: 200, shadowMap: 4096, far: 4000 });
scene.background = new THREE.Color(0x15110e);
const anchor = new THREE.Object3D();   // the shadow camera stays centred on the board
scene.add(anchor);
look.follow(anchor);

// The scene renders with a depth texture, so the blur can tell where each pixel is in the world.
const target = new THREE.WebGLRenderTarget(1, 1, { samples: 4, type: THREE.HalfFloatType });
target.depthTexture = new THREE.DepthTexture(1, 1);
const composer = new EffectComposer(renderer, target);
composer.addPass(new RenderPass(scene, camera));

// Tilt-shift that leaves the table alone: a pixel whose world position is on the table, or in the air above it, stays
// sharp; the room around it gets the miniature blur, stronger towards the top and bottom of the screen.
// The first pass blurs across and writes "on the table" into alpha; the second blurs down and reads it back.
const TABLE_BOX = { min: new THREE.Vector3(-BOARD_W / 2 - 1.5, -6, -BOARD_D / 2 - 1.5), max: new THREE.Vector3(BOARD_W / 2 + 1.5, 80, BOARD_D / 2 + 1.5) };
const BLUR_TAPS = `
  vec4 c = texture2D(tDiffuse, vUv);
  float k = amount * abs(r - vUv.y);
  vec3 sum = c.rgb * 0.1633;
  sum += (texture2D(tDiffuse, vUv - 1.0 * k * dir).rgb + texture2D(tDiffuse, vUv + 1.0 * k * dir).rgb) * 0.1531;
  sum += (texture2D(tDiffuse, vUv - 2.0 * k * dir).rgb + texture2D(tDiffuse, vUv + 2.0 * k * dir).rgb) * 0.12245;
  sum += (texture2D(tDiffuse, vUv - 3.0 * k * dir).rgb + texture2D(tDiffuse, vUv + 3.0 * k * dir).rgb) * 0.0918;
  sum += (texture2D(tDiffuse, vUv - 4.0 * k * dir).rgb + texture2D(tDiffuse, vUv + 4.0 * k * dir).rgb) * 0.051;`;
const blurShader = (first) => ({
  uniforms: {
    tDiffuse: { value: null }, tDepth: { value: null }, amount: { value: 0 }, r: { value: 0.5 }, dir: { value: new THREE.Vector2(first ? 1 : 0, first ? 0 : 1) },
    projInv: { value: new THREE.Matrix4() }, camWorld: { value: new THREE.Matrix4() }, boxMin: { value: TABLE_BOX.min }, boxMax: { value: TABLE_BOX.max },
  },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform sampler2D tDepth; uniform float amount; uniform float r; uniform vec2 dir;
    uniform mat4 projInv; uniform mat4 camWorld; uniform vec3 boxMin; uniform vec3 boxMax;
    varying vec2 vUv;
    float onTable() {
      float d = texture2D(tDepth, vUv).x;
      if (d >= 1.0) return 0.0;
      vec4 v = projInv * vec4(vUv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
      vec3 w = (camWorld * vec4(v.xyz / v.w, 1.0)).xyz;
      return (all(greaterThanEqual(w, boxMin)) && all(lessThanEqual(w, boxMax))) ? 1.0 : 0.0;
    }
    void main() {
      ${BLUR_TAPS}
      float table = ${first ? 'onTable()' : 'c.a'};
      gl_FragColor = vec4(mix(sum, c.rgb, table), ${first ? 'table' : '1.0'});   // the mask rides in alpha between the two passes only
    }`,
});
class TableSafeBlur extends ShaderPass {
  render(renderer, writeBuffer, readBuffer, ...rest) {
    if (this.uniforms.tDepth) {
      this.uniforms.tDepth.value = readBuffer.depthTexture;
      this.uniforms.projInv.value.copy(camera.projectionMatrixInverse);
      this.uniforms.camWorld.value.copy(camera.matrixWorld);
    }
    super.render(renderer, writeBuffer, readBuffer, ...rest);
  }
}
const tiltH = new TableSafeBlur(blurShader(true));
const tiltV = new TableSafeBlur(blurShader(false));
const saturate = new ShaderPass(HueSaturationShader);
saturate.uniforms.saturation.value = 0.18;   // a touch of extra colour, like a painted model
composer.addPass(tiltH); composer.addPass(tiltV); composer.addPass(saturate);
composer.addPass(new OutputPass());
let tiltOn = true;
function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
resize();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.minDistance = 1.5;    // close enough to see a butterfly on a flower
controls.maxDistance = 900;
controls.maxPolarAngle = THREE.MathUtils.degToRad(78);
controls.screenSpacePanning = false;

// ---- loading parts from Polyfork's CDN ----
// Parts are named by their kit key (as in each kit's PARTS.json); this maps each key to its Polyfork asset id.
// Kits: Countryside Railway (trains, track, station), Neighborhood Pathways (the town), Open Plan (the basement).
const IDS = {
  'alcove-bookcase': 'alcove-bookcase-83894d', 'area-rug': 'area-rug-5c56e2', 'brake-coach': 'brake-coach-f83456',
  'broad-canopy-shade-tree': 'broad-canopy-shade-tree-e7c4a2', 'cattle-wagon': 'cattle-wagon-0d3070',
  'ceramic-floor-tile': 'ceramic-floor-tile-ecf05f', 'coal-stage': 'coal-stage-2789f5',
  'coal-tender': 'coal-tender-0e3647', 'cobbled-yard-tile': 'cobbled-yard-tile-d00544',
  'cobra-head-street-light': 'cobra-head-street-light-3e25b8', 'colour-light-signal': 'colour-light-signal-713276',
  'column-radiator': 'column-radiator-18af7e', 'covered-van': 'covered-goods-van-34fce3',
  'curbside-mailbox': 'curbside-mailbox-0e0736', 'curved-track': 'curved-track-819ec6',
  'desk-monitor': 'desk-monitor-32cfce', 'engine-shed': 'engine-shed-eff627',
  'family-crossover-suv': 'family-crossover-suv-42027f', 'floor-lamp': 'arc-floor-lamp-fa0b5f',
  'framed-art': 'framed-wall-art-d2c8a2', 'goods-shed': 'goods-shed-206be9',
  'ground-disc-signal': 'ground-disc-signal-3d52e9', 'guards-van': 'guard-s-van-6231d0',
  'hopper-wagon': 'hopper-wagon-b4c486', 'lineside-buddleia': 'lineside-buddleia-36cd9a',
  'lineside-cow-parsley': 'lineside-cow-parsley-4a8bfd', 'lineside-hut': 'lineside-hut-2b43ff',
  'lineside-tree': 'lineside-tree-97e02a', 'living-sofa': 'sofa-9c0e7e', 'luggage-trolley': 'luggage-trolley-0bb740',
  'mainline-diesel': 'mainline-diesel-locomotive-33ef97', 'office-chair': 'office-chair-7c9874',
  'office-desk': 'office-desk-021eb3', 'open-wagon': 'open-goods-wagon-998292',
  'ornamental-front-yard-tree': 'ornamental-front-yard-tree-c6781a',
  'park-picnic-shelter': 'park-picnic-shelter-9548a3', 'passenger': 'passenger-ac425a',
  'passenger-carriage': 'passenger-carriage-de9d58', 'platelayer': 'platelayer-47dbe6',
  'platform-canopy-run': 'platform-canopy-run-bc2275', 'platform-poster-board': 'platform-poster-board-271c7a',
  'platform-run': 'platform-run-3738d0', 'porch-front-cottage': 'porch-front-cottage-620c29',
  'porter': 'porter-e4e566', 'railway-cartage-lorry': 'railway-cartage-lorry-c51950',
  'railway-carter': 'railway-carter-971897', 'railway-container': 'railway-container-1cfbbd',
  'residential-street-tile': 'residential-street-tile-f07dda', 'running-in-board': 'a-running-in-board-e66b1e',
  'semaphore-signal': 'semaphore-signal-cb8968', 'side-table': 'side-table-2ea5c0',
  'signal-box': 'signal-box-f57a2d', 'signalman': 'signalman-c561d7',
  'single-storey-ranch-house': 'single-storey-ranch-house-3880ea', 'sleeper-stack': 'sleeper-stack-67628e',
  'split-level-house': 'split-level-house-40fe1a', 'staircase-flight': 'straight-stair-flight-236ae7',
  'station-bench': 'station-bench-5f56b4', 'station-building': 'country-station-building-2d8f5e',
  'station-clock-post': 'station-clock-post-eaaf63', 'station-lamp-post': 'station-lamp-post-7d14dd',
  'station-master': 'station-master-1d6a0a', 'storage-basket': 'woven-storage-basket-983d80',
  'straight-track': 'straight-track-d4cf38', 'tank-locomotive': 'tank-steam-locomotive-314bb1',
  'tank-wagon': 'tank-wagon-d860fa', 'telegraph-pole-run': 'railway-telegraph-pole-run-bb9354',
  'tender-locomotive': 'tender-steam-locomotive-8e2a82', 'townhouse-row-unit': 'townhouse-row-unit-b9544b',
  'trainspotter': 'trainspotter-ffd141', 'two-storey-family-house': 'two-storey-family-house-c63c4a',
  'wall-segment-plain': 'plain-wall-segment-143b6d', 'water-pump-house': 'water-pump-house-121270',
  'water-tower': 'water-tower-dd6200', 'waving-child': 'waving-child-dfada0', 'yard-crane': 'yard-crane-316e4a',
};
const CDN = 'https://polyfork.dev/cdn/';
const modules = new Map();
async function load(id) {
  if (!modules.has(id)) modules.set(id, import(`${CDN}${id}.mjs`));
  return modules.get(id);
}
const part = async (key, params = {}) => (await load(IDS[key] ?? key)).createAsset(params);   // a key, or an asset id
const rail = part, hood = part, home = part, prop = part;
// start every download at once; the build below then finds each module already on its way
[...Object.values(IDS), 'supply-shelving-rack-ae446a', 'cardboard-delivery-box-59cc68', 'field-workbench-70f706',
  'cow-base', 'horse-base', 'sheep-base', 'dog-base', 'farm-dog-723730', 'duck-base', 'pigeon-base', 'crow-base', 'herring-gull-base',
  'suburban-resident-a9db9c', 'neighborhood-child-8cc5ac', 'wooden-fence-section-d72055', 'farm-gate-8ab320', 'hay-bale-079e8c',
  'water-trough-df3ced', 'butterfly-base', 'flower-bed-708e73', 'pastel-flowering-plant-d16a03', 'wildflower-68d3a1', 'sunflower-80ce15',
  'low-garden-wall-run-a34d05', 'backyard-garden-shed-38d79f', 'flowering-magnolia-dd76cb', 'lotus-flower-cluster-bc129a', 'reed-bed-bbbefb',
  'backyard-swing-set-38637e', 'playground-roundabout-e4d43b', 'climbing-frame-e917d5', 'rope-swing-on-a-ada4bb', 'playground-slide-8b764c',
  'kite-kid-base', 'kite-kid-0a7d70', 'volantin-398e88', 'village-child-bef09e', 'child-with-a-painted-b8a19f', 'pupil-standing-0bd6d5',
  'kid-in-a-caped-663f11'].forEach(load);

const layout = new THREE.Group();   // everything on the baseboard, in layout metres
scene.add(layout);
function put(parent, obj, x, y, z, ryDeg = 0) {
  obj.position.set(x, y, z);
  obj.rotation.y = THREE.MathUtils.degToRad(ryDeg);
  parent.add(obj);
  return obj;
}

// ---- the baseboard: a grass mat on a painted wooden frame ----
step('building the baseboard');
{
  const grass = new THREE.PlaneGeometry(BOARD_W, BOARD_D, Math.round(BOARD_W), Math.round(BOARD_D));
  grass.rotateX(-Math.PI / 2);
  const colors = [], c = new THREE.Color(), base = new THREE.Color(0x6f8a32), dry = new THREE.Color(0x9b9a4a);
  const p = grass.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const patch = 0.5 + 0.5 * Math.sin(x * 0.11 + Math.sin(z * 0.07) * 2) * Math.sin(z * 0.13 - x * 0.05);
    c.copy(base).lerp(dry, patch * 0.45 + Math.random() * 0.12).multiplyScalar(0.92 + Math.random() * 0.12);
    colors.push(c.r, c.g, c.b);
  }
  grass.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const mat = new THREE.Mesh(grass, new THREE.MeshLambertMaterial({ vertexColors: true }));
  mat.position.y = 0.005;
  layout.add(mat);
  const wood = new THREE.MeshLambertMaterial({ color: 0x4a2f1f });
  const fasciaH = 5;
  const box = (w, h, d, x, y, z, m = wood) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); layout.add(b); return b; };
  box(BOARD_W, 2, BOARD_D, 0, -1.3, 0, new THREE.MeshLambertMaterial({ color: 0x6b5a45 }));   // plywood top, a little under the grass mat
  box(BOARD_W + 1.6, fasciaH, 0.8, 0, -fasciaH / 2 + 0.4, BOARD_D / 2 + 0.4);
  box(BOARD_W + 1.6, fasciaH, 0.8, 0, -fasciaH / 2 + 0.4, -BOARD_D / 2 - 0.4);
  box(0.8, fasciaH, BOARD_D, BOARD_W / 2 + 0.4, -fasciaH / 2 + 0.4, 0);
  box(0.8, fasciaH, BOARD_D, -BOARD_W / 2 - 0.4, -fasciaH / 2 + 0.4, 0);
  const legH = TABLE_HEIGHT * MODEL_SCALE - fasciaH;
  for (const sx of [-1, 0, 1]) for (const sz of [-1, 1]) {   // a long table wants a middle pair of legs
    box(2.8, legH, 2.8, sx * (BOARD_W / 2 - 4), -fasciaH - legH / 2, sz * (BOARD_D / 2 - 4), new THREE.MeshLambertMaterial({ color: 0x8a6a48 }));
  }
}

// ---- track: three concentric ovals at the kit's 4 m track centres ----
// Each loop is a path (two straights, two semicircles) and the kit's straight and 45 degree curve pieces laid along it.
function makeLoop(R) {
  const segs = [];
  let x = -STRAIGHT / 2, z = R, yaw = Math.PI / 2, s = 0;   // start at the front-left, heading +x; yaw 0 means heading +z
  for (let side = 0; side < 2; side++) {
    for (let i = 0; i < STRAIGHT / 8; i++) {
      segs.push({ type: 'line', s0: s, len: 8, x, z, yaw });
      x += Math.sin(yaw) * 8; z += Math.cos(yaw) * 8; s += 8;
    }
    for (let j = 0; j < 4; j++) {
      const a = Math.PI / 4, cx = x + R * Math.cos(yaw), cz = z - R * Math.sin(yaw);
      segs.push({ type: 'arc', s0: s, len: R * a, x, z, yaw, cx, cz, R });
      yaw += a; x = cx - R * Math.cos(yaw); z = cz + R * Math.sin(yaw); s += R * a;
    }
  }
  const length = s;
  function at(sv, out = { x: 0, z: 0, yaw: 0 }) {
    sv = ((sv % length) + length) % length;
    let lo = 0, hi = segs.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (segs[mid].s0 <= sv) lo = mid; else hi = mid - 1; }
    const g = segs[lo], d = sv - g.s0;
    if (g.type === 'line') { out.x = g.x + Math.sin(g.yaw) * d; out.z = g.z + Math.cos(g.yaw) * d; out.yaw = g.yaw; }
    else { const y = g.yaw + d / g.R; out.x = g.cx - g.R * Math.cos(y); out.z = g.cz + g.R * Math.sin(y); out.yaw = y; }
    return out;
  }
  return { R, segs, length, at };
}

async function layTrack(loop, colorway) {
  const straight = await rail('straight-track', { colorway, length: 8, slab: '#6c8634' });   // the straights' concrete edge slabs painted as grass, like the curves
  const curve = await rail('curved-track', { colorway, radius: loop.R, angle: 45 });
  // which way does the kit's curve bend? Read it rather than assume: its centre sits on the side it turns toward.
  curve.updateMatrixWorld(true);
  const cb = new THREE.Box3().setFromObject(curve);
  const bend = Math.sign(cb.getCenter(new THREE.Vector3()).x) || 1;
  const a = Math.PI / 4;
  const ex = bend * loop.R * (1 - Math.cos(a)), ez = loop.R * Math.sin(a), endYaw = bend * a;
  for (const g of loop.segs) {
    if (g.type === 'line') { put(layout, straight.clone(), g.x, 0, g.z).rotation.y = g.yaw; continue; }
    const piece = curve.clone();
    if (bend === 1) { put(layout, piece, g.x, 0, g.z).rotation.y = g.yaw; continue; }
    // the piece bends the other way: lay it end-first, which turns it into a curve the way this loop needs
    const th = g.yaw - (endYaw + Math.PI);
    const px = g.x - (ex * Math.cos(th) + ez * Math.sin(th)), pz = g.z - (-ex * Math.sin(th) + ez * Math.cos(th));
    put(layout, piece, px, 0, pz).rotation.y = th;
  }
}

// ---- trains ----
// A vehicle stands on two pivots (its bogie centres, or its outer axles), each placed on the path, which is how a real
// bogie vehicle sits on a curve: the body is a chord between them.
function measureVehicle(obj, flip) {
  const holder = new THREE.Group();
  holder.add(obj);
  if (flip) obj.rotation.y = Math.PI;
  holder.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(holder);
  const wp = new THREE.Vector3(), nodes = [];
  holder.traverse((o) => { if (o !== obj && o.name) nodes.push(o); });
  const zOf = (o) => holder.worldToLocal(o.getWorldPosition(wp)).z;
  const bogies = nodes.filter((o) => /^bogie(-[fr])?$/.test(o.name)).map((o) => ({ node: o, z: zOf(o) }));
  const wheels = [];
  for (const o of nodes.filter((n) => /wheel/.test(n.name))) {
    const wb = new THREE.Box3().setFromObject(o), centre = wb.getCenter(new THREE.Vector3());
    const pivot = o.getWorldPosition(new THREE.Vector3());
    const r = (wb.max.y - wb.min.y) / 2;
    // spin only wheels whose pivot is their axle, so nothing wobbles
    if (r > 0.1 && Math.hypot(centre.y - pivot.y, centre.z - pivot.z) < 0.06) wheels.push({ node: o, r, z: zOf(o) });
  }
  let pf, pr;
  if (bogies.length >= 2) { pf = Math.max(...bogies.map((b) => b.z)); pr = Math.min(...bogies.map((b) => b.z)); }
  else {
    const zs = [...bogies.map((b) => b.z), ...wheels.map((w) => w.z)];
    if (zs.length >= 2) { pf = Math.max(...zs); pr = Math.min(...zs); }
    else { const mid = (box.max.z + box.min.z) / 2, half = (box.max.z - box.min.z) * 0.3; pf = mid + half; pr = mid - half; }
  }
  return { holder, front: box.max.z, length: box.max.z - box.min.z, pf, pr, bogies, wheels, spin: flip ? -1 : 1 };
}

const tmpF = { x: 0, z: 0, yaw: 0 }, tmpR = { x: 0, z: 0, yaw: 0 }, tmpB = { x: 0, z: 0, yaw: 0 };
function wrapAngle(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }
function poseTrain(t, ds) {
  let front = t.s;
  for (const car of t.cars) {
    const origin = front - car.front;             // path position of the vehicle's own z = 0
    t.path.at(origin + car.pf, tmpF); t.path.at(origin + car.pr, tmpR);
    const dx = tmpF.x - tmpR.x, dz = tmpF.z - tmpR.z, len = Math.hypot(dx, dz) || 1;
    const yaw = Math.atan2(dx, dz);
    car.holder.position.set(tmpR.x + (dx / len) * -car.pr, 0, tmpR.z + (dz / len) * -car.pr);
    car.holder.rotation.y = yaw;
    for (const b of car.bogies) b.node.rotation.y = wrapAngle(t.path.at(origin + b.z, tmpB).yaw - yaw);
    for (const w of car.wheels) w.node.rotation.x += car.spin * ds / w.r;
    front -= car.length + COUPLING_GAP;
  }
}

// ---- life on the layout: farm animals, birds and people that move ----
// Every model is at its real size in metres, the same as the trains, so a cow stands as tall against a coach as it would
// in a real field. Animals walk with Polyfork's walker (feet planted, phase from distance travelled); birds flap by
// turning their wing bones; people use the humanoid walk and idle clips.
step('letting the animals out');
const { walker, flatGround, naturalSpeed } = await import('https://polyfork.dev/cdn/walk.mjs');
const rand = (a, b) => a + Math.random() * (b - a), d2r = THREE.MathUtils.degToRad;
const AXES = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
const movers = [];   // everything that moves on its own: each has update(dt, t)

async function creature(key, params, x, z, y = 0, ry = rand(0, 360)) {
  const mod = await load(IDS[key] ?? key);
  const o = put(layout, mod.createAsset(params ?? {}), x, y, z, ry);
  o.updateMatrixWorld(true);
  return { o, rig: mod.rig ?? {} };
}
// turn a bone to a share of the range its model declares (0 = rest, 1 = the far end of the range)
function bend(c, name, amount) {
  const b = c.o.getObjectByName(name), r = c.rig[name];
  if (!b || !r) return;
  b.userData.rest ??= b.quaternion.clone();
  b.quaternion.copy(b.userData.rest);
  b.rotateOnAxis(AXES[r.axis] ?? AXES.x, d2r(r.range[0] + (r.range[1] - r.range[0]) * amount));
}
function turnToward(heading, want, rate, dt) {
  return heading + THREE.MathUtils.clamp(wrapAngle(want - heading), -rate * dt, rate * dt);
}

// an animal that ambles to a random spot in its area, stops (and grazes or pecks), then picks another;
// or, with `follow`, keeps a little behind someone
function wander(c, { area, speed, pauses = [3, 9], graze = 0, peck = false, follow = null, ground = 0, turn = 1.4, herd = null, avoid = [] }) {
  const gait = walker(c.o, { ground: flatGround(ground) });
  const size = new THREE.Box3().setFromObject(c.o).getSize(new THREE.Vector3()), radius = Math.max(size.x, size.z) * 0.45;
  const clear = (x, z) => avoid.every(([ax, az, ar]) => Math.hypot(x - ax, z - az) > ar + radius);
  if (herd) herd.push({ o: c.o, radius });
  const v = speed ?? naturalSpeed(gait);
  let dist = 0, walking = false, timer = rand(0, 4), tx = 0, tz = 0, heading = c.o.rotation.y, down = 0, head = 0;
  const phase = rand(0, 10);
  movers.push({ o: c.o, update(dt, t) {
    const p = c.o.position;
    if (follow) {
      const q = follow.position, yaw = follow.rotation.y;
      tx = q.x - Math.sin(yaw) * 1.6 + Math.cos(yaw) * 0.9; tz = q.z - Math.cos(yaw) * 1.6 - Math.sin(yaw) * 0.9;
      walking = Math.hypot(tx - p.x, tz - p.z) > 0.5;
    } else if (!walking && (timer -= dt) <= 0) {
      for (let k = 0; k < 8; k++) { tx = rand(area[0], area[1]); tz = rand(area[2], area[3]); if (clear(tx, tz)) break; }
      walking = true;
    }
    if (walking) {
      const dx = tx - p.x, dz = tz - p.z, far = Math.hypot(dx, dz);
      if (far < 0.4 && !follow) { walking = false; timer = rand(...pauses); }
      else {
        const want = Math.atan2(dx, dz);
        heading = turnToward(heading, want, turn, dt);
        const sharp = Math.abs(wrapAngle(want - heading)) > 1.0;
        // a follower trots to keep up, then eases in as it closes the gap
        const ds = Math.min(far, (follow ? Math.min(2.4, far * 1.5) : v) * dt * (sharp ? 0.35 : 1));
        p.x += Math.sin(heading) * ds; p.z += Math.cos(heading) * ds; dist += ds;
      }
    }
    // keep a little personal space from the rest of the herd and out of the trough
    if (herd) for (const other of herd) {
      if (other.o === c.o) continue;
      const dx = p.x - other.o.position.x, dz = p.z - other.o.position.z, gap = Math.hypot(dx, dz) || 1e-3, need = radius + other.radius;
      if (gap < need) { const push = (need - gap) * Math.min(1, dt * 3); p.x += (dx / gap) * push; p.z += (dz / gap) * push; }
    }
    for (const [ax, az, ar] of avoid) {
      const dx = p.x - ax, dz = p.z - az, gap = Math.hypot(dx, dz) || 1e-3, need = ar + radius;
      if (gap < need) { p.x = ax + (dx / gap) * need; p.z = az + (dz / gap) * need; }
    }
    c.o.rotation.y = heading;
    c.o.updateMatrixWorld(true);
    gait.poseAt(dist);
    // heads: down to graze, quick bobs to peck, a slow look around while standing
    const grazing = !walking && graze && Math.sin(t * 0.15 + phase) > 0.3 - graze;
    down += ((grazing ? 1 : 0) - down) * Math.min(1, dt * 1.2);
    const bob = peck && !walking ? Math.max(0, Math.sin(t * 9 + phase)) ** 4 : 0;
    bend(c, 'Neck', Math.max(down, bob));
    head += ((walking ? 0 : Math.sin(t * 0.6 + phase) * 0.8) - head) * Math.min(1, dt * 2);
    bend(c, 'Head', head);
  } });
  return c;
}

// a bird that circles over the layout, flapping, gliding now and then, banked into the turn
async function flier(key, { cx, cz, r, h, speed, dir }) {
  const c = await creature(key, {}, cx + r, cz, h, 0);
  const wings = ['LeftWing', 'RightWing'].map((n) => c.o.getObjectByName(n));
  const rest = wings.map((w) => w.quaternion.clone());
  let a = rand(0, Math.PI * 2), flap = 0;
  const phase = rand(0, 10), beat = rand(7, 10);
  movers.push({ o: c.o, bird: true, update(dt, t) {
    a += (dir * speed / r) * dt;
    const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
    c.o.position.set(x, h + Math.sin(t * 0.4 + phase) * 2, z);
    c.o.rotation.set(0, Math.atan2(-Math.sin(a) * dir, Math.cos(a) * dir), 0);
    c.o.rotateZ(-dir * 0.4);                                        // bank into the circle
    const gliding = Math.sin(t * 0.5 + phase) > 0.55;
    flap += ((gliding ? 6 : 34 * Math.sin(t * beat + phase)) - flap) * Math.min(1, dt * 12);
    wings.forEach((w, i) => {
      w.quaternion.copy(rest[i]);
      w.rotateY(d2r(i === 0 ? -80 : 80));                           // open the folded wing out to the side
      w.rotateX(d2r(flap));                                         // and beat it up and down
    });
  } });
}

// a person who walks a route and back (or round and round), pausing at the ends
async function stroller(key, params, route, { y = 0.06, speed = 1.3, loop = false, pauses = [1, 3.5] } = {}) {
  const c = await creature(key, params, route[0][0], route[0][1], y);
  let anim = null;
  try { anim = await animate(c.o); } catch { /* walks in a rest pose without the clip */ }
  let i = 1, dir = 1, wait = rand(0, 3), heading = c.o.rotation.y;
  movers.push({ update(dt) {
    const p = c.o.position;
    if (wait > 0) { wait -= dt; anim?.locomotion(0); }
    else {
      const [tx, tz] = route[i], dx = tx - p.x, dz = tz - p.z, far = Math.hypot(dx, dz);
      if (far < 0.25) {
        const end = !loop && (i + dir < 0 || i + dir >= route.length);
        if (end) { dir = -dir; wait = rand(...pauses); }
        i = loop ? (i + 1) % route.length : i + dir;
      } else {
        const want = Math.atan2(dx, dz);
        heading = turnToward(heading, want, 4, dt);
        const ds = Math.min(far, speed * dt);
        p.x += Math.sin(heading) * ds; p.z += Math.cos(heading) * ds;
        anim?.locomotion(speed);
      }
    }
    c.o.rotation.y = heading;
    anim?.update(dt);
  } });
  return c.o;
}

      if (settled <= 0) {

      open = 45 + 40 * Math.sin(t * 26 + phase);                          // fast wingbeats in flight

// a game of tag round the playground: one kid runs off, the others give chase
async function runner(i, leader = null) {
  const k = await kid(i, rand(PLAY.x0, PLAY.x1), rand(PLAY.z0, PLAY.z1));
  let tx = k.o.position.x, tz = k.o.position.z, heading = rand(0, 6.3), rest = 0, best = Infinity, stuck = 0;
  const radius = 0.35;
  const clear = (x, z) => AVOID_PLAY.every(([ox, oz, orad]) => Math.hypot(x - ox, z - oz) > orad + 0.8);
  const pick = () => { for (let n = 0; n < 12; n++) { tx = rand(PLAY.x0, PLAY.x1); tz = rand(PLAY.z0, PLAY.z1); if (clear(tx, tz)) break; } best = Infinity; stuck = 0; };
  movers.push({ o: k.o, update(dt) {
    const p = k.o.position;
    if (leader) { tx = leader.position.x; tz = leader.position.z; }
    else if (Math.hypot(tx - p.x, tz - p.z) < 0.6) {
      if ((rest -= dt) <= 0) { rest = Math.random() < 0.3 ? rand(0.6, 1.5) : 0; pick(); }
    } else {
      // blocked by something on the way? after a couple of seconds without getting closer, run somewhere else
      const d = Math.hypot(tx - p.x, tz - p.z);
      if (d < best - 0.05) { best = d; stuck = 0; } else if ((stuck += dt) > 2) pick();
    }
    const far = Math.hypot(tx - p.x, tz - p.z);
    const speed = leader ? (far > 1.4 ? 3.0 : 0) : (far > 0.6 ? 3.4 : 0);
    if (speed > 0) {
      heading = turnToward(heading, Math.atan2(tx - p.x, tz - p.z), 6, dt);
      p.x += Math.sin(heading) * speed * dt; p.z += Math.cos(heading) * speed * dt;
    }
    for (const [ox, oz, orad] of AVOID_PLAY) {   // dodge round the play equipment
      const dx = p.x - ox, dz = p.z - oz, gap = Math.hypot(dx, dz) || 1e-3;
      if (gap < orad + radius) { p.x = ox + (dx / gap) * (orad + radius); p.z = oz + (dz / gap) * (orad + radius); }
    }
    k.o.rotation.y = heading;
    k.anim?.locomotion(speed); k.anim?.update(dt);
  } });
  return k.o;
}

// kites: two kids on the grass beside the playground, kites riding the wind high over the layout on sagging strings
async function kiteFlyer(key, params, route, wind) {
  const o = await stroller(key, params, route, { speed: 0.6, pauses: [3, 7] });
  const hand = o.getObjectByName('RightHand') ?? o;
  const kite = put(layout, await part('volantin-398e88'), route[0][0] + wind[0], 15, route[0][1] + wind[1]);
  const N = 24, pts = new Float32Array(N * 3);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xf2efe4 }));
  line.frustumCulled = false; layout.add(line);
  const h = new THREE.Vector3(), phase = rand(0, 10);
  movers.push({ update(dt, t) {
    const p = o.position;
    kite.position.set(p.x + wind[0] + Math.sin(t * 0.7 + phase) * 1.8, 15 + Math.sin(t * 0.45 + phase) * 2.2 + Math.sin(t * 1.9) * 0.4, p.z + wind[1] + Math.cos(t * 0.55 + phase) * 1.4);
    hand.getWorldPosition(h); layout.worldToLocal(h);
    kite.lookAt(h.x, h.y, h.z); kite.rotateY(Math.PI / 2); kite.rotateZ(Math.sin(t * 1.3 + phase) * 0.25);   // face the kid, and wobble
    for (let i = 0; i < N; i++) {   // a string that sags a little in the middle
      const u = i / (N - 1), sag = Math.sin(u * Math.PI) * 1.6;
      pts[i * 3] = h.x + (kite.position.x - h.x) * u; pts[i * 3 + 1] = h.y + (kite.position.y - 0.6 - h.y) * u - sag; pts[i * 3 + 2] = h.z + (kite.position.z - h.z) * u;
    }
    geo.attributes.position.needsUpdate = true;
  } });
}

const wallPlanes = { north: -ROOM_D / 2, south: ROOM_D / 2, west: -ROOM_W / 2, east: ROOM_W / 2 };
function cutaway() {

}

// ---- whistles and horns, made with WebAudio ----
let audio = null;
function whistle(kind) {
  audio ||= new AudioContext();
  const t0 = audio.currentTime, dur = kind === 'steam' ? 0.9 : 1.1;
  const out = audio.createGain();
  out.gain.setValueAtTime(0, t0);
  out.gain.linearRampToValueAtTime(0.09, t0 + 0.06);
  out.gain.setValueAtTime(0.09, t0 + dur - 0.2);
  out.gain.linearRampToValueAtTime(0, t0 + dur);
  const filter = audio.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = kind === 'steam' ? 2600 : 1200;
  out.connect(filter).connect(audio.destination);
  const notes = kind === 'steam' ? [587, 740, 880] : [277, 349];
  for (const f of notes) {
    const o = audio.createOscillator();
    o.type = kind === 'steam' ? 'triangle' : 'sawtooth';
    o.frequency.setValueAtTime(f * 0.97, t0); o.frequency.linearRampToValueAtTime(f, t0 + 0.08);
    o.connect(out); o.start(t0); o.stop(t0 + dur + 0.05);
  }
}

// ---- keyboard ----
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.key.startsWith('Arrow')) e.target.blur();
  const k = e.key.toLowerCase();
  if (['1', '2', '3'].includes(k)) select(Number(k) - 1);
  else if (k === ' ') { setThrottle(trains[selected], 0); e.preventDefault(); }
  else if (k === 'h') whistle(trains[selected].whistle);
  else if (k === 'c') { if (touring) toggleTour(); toggleRide(); }
  else if (k === 'f') toggleTour();
  else if (k === 't') tiltOn = !tiltOn;
  else if (k === 'escape' && riding) toggleRide();
  else if (k === 'escape' && touring) toggleTour();
  // each press, and each key repeat while it is held, moves the throttle a notch
  else if (k === 'w' || k === 'arrowup') setThrottle(trains[selected], trains[selected].throttle + 0.05);
  else if (k === 's' || k === 'arrowdown') setThrottle(trains[selected], trains[selected].throttle - 0.05);
  if (k.startsWith('arrow')) e.preventDefault();
});

// ---- ride-along camera ----
const saved = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
function toggleRide() {
  riding = !riding;
  controls.enabled = !riding;
  if (riding) { saved.pos.copy(camera.position); saved.target.copy(controls.target); camera.fov = 50; }
  else { camera.position.copy(saved.pos); controls.target.copy(saved.target); camera.fov = 24; }
  camera.updateProjectionMatrix();
  $('mode').textContent = riding ? `Riding ${trains[selected].name} · C to step back` : 'Overview · drag to orbit, scroll to zoom';
}
const rideGoal = new THREE.Vector3(), rideLook = new THREE.Vector3(), rideLookNow = new THREE.Vector3();
function rideCamera(dt) {
  const t = trains[selected], dir = Math.sign(t.speed || 1);
  const ref = dir < 0 ? t.cars[t.cars.length - 1].holder : t.cars[0].holder;   // in reverse, ride at the tail
  const yaw = ref.rotation.y + (dir < 0 ? Math.PI : 0);
  const fx = Math.sin(yaw), fz = Math.cos(yaw);
  const base = ref.position;
  rideGoal.set(base.x - fx * 16, 7.5, base.z - fz * 16);
  rideLook.set(base.x + fx * 24, 1.5, base.z + fz * 24);
  const k = 1 - Math.exp(-5 * dt);
  camera.position.lerp(rideGoal, k);
  rideLookNow.lerp(rideLook, k);
  camera.lookAt(rideLookNow);
}

// ---- flying tour (F): the camera glides round the cool parts of the table, always with track in the shot ----
// Each stop is a camera position and the point it looks at; a smooth closed curve runs through both lists.
const TOUR = [
  [[-22, 13, 52], [-2, 1, 21]],        // the station, trains running past the platform
  [[38, 17, 50], [40, 1, 10]],         // the forecourt and the east end of the loops
  [[98, 16, 42], [70, 0, 14]],         // the garden and the duck pond, the line beyond
  [[96, 22, -30], [60, 0, -6]],        // past the pond to the goods shed
  [[44, 21, -60], [10, 1, -22]],       // along the town street, the back straight below
  [[-40, 22, -56], [-48, 1, -8]],      // the engine shed and the west curve
  [[-98, 22, -34], [-68, 0, -6]],      // over the farm, the line behind the paddock
  [[-92, 26, 30], [-50, 0, 6]],        // out past the farmhouse, looking back at the loops
  [[-30, 48, 44], [0, 0, 0]],          // up high over the whole layout
  [[-6, 13, 17], [-16, 2, -3]],        // down over the kids' park in the middle, kites overhead
];
const tourPos = new THREE.CatmullRomCurve3(TOUR.map(([p]) => new THREE.Vector3(...p)), true, 'centripetal');
const tourLook = new THREE.CatmullRomCurve3(TOUR.map(([, l]) => new THREE.Vector3(...l)), true, 'centripetal');
const TOUR_SECONDS = 90, TOUR_FOV = 32;
let touring = false, tourU = 0, tourIn = 0;
const tourFrom = { pos: new THREE.Vector3(), look: new THREE.Vector3(), fov: 24 };
const tourNow = { pos: new THREE.Vector3(), look: new THREE.Vector3() };
function toggleTour() {
  if (riding) toggleRide();
  touring = !touring;
  controls.enabled = !touring;
  if (touring) {
    // start from the stop nearest the camera, and ease in from where the camera is now
    let best = 0;
    TOUR.forEach(([p], i) => { if (camera.position.distanceTo(new THREE.Vector3(...p)) < camera.position.distanceTo(new THREE.Vector3(...TOUR[best][0]))) best = i; });
    tourU = best / TOUR.length; tourIn = 0;
    tourFrom.pos.copy(camera.position); tourFrom.look.copy(controls.target); tourFrom.fov = camera.fov;
  } else {
    controls.target.copy(tourNow.look);   // hand the view back to orbiting, right where the tour left it
    camera.fov = 24; camera.updateProjectionMatrix();
  }
  $('mode').textContent = touring ? 'Flying tour · F or Esc to stop, or grab the view' : 'Overview · drag to orbit, scroll to zoom';
}
function tourCamera(dt) {
  tourU = (tourU + dt / TOUR_SECONDS) % 1;
  tourIn = Math.min(1, tourIn + dt / 2.5);
  const e = tourIn * tourIn * (3 - 2 * tourIn);   // smoothstep from the old view onto the tour path
  tourNow.pos.copy(tourFrom.pos).lerp(tourPos.getPointAt(tourU), e);
  tourNow.look.copy(tourFrom.look).lerp(tourLook.getPointAt(tourU), e);
  camera.position.copy(tourNow.pos);
  camera.lookAt(tourNow.look);
  const fov = THREE.MathUtils.lerp(tourFrom.fov, TOUR_FOV, e);
  if (Math.abs(fov - camera.fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
}
renderer.domElement.addEventListener('pointerdown', () => { if (touring) toggleTour(); });   // grabbing the view ends the tour

// ---- the loop ----
const clock = new THREE.Clock();
$('loading').remove();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const sel = trains[selected];
  for (const t of trains) {
    const goal = t.throttle * VMAX;
    t.speed += THREE.MathUtils.clamp(goal - t.speed, -ACCEL * dt, ACCEL * dt);
    const ds = t.speed * dt;
    t.s += ds;
    poseTrain(t, ds);
    const kmh = Math.abs(t.speed) * 3.6;
    t.ui.spd.textContent = `${kmh.toFixed(0)} scale km/h`;
    t.ui.dir.textContent = Math.abs(t.speed) < 0.05 ? 'stopped' : t.speed > 0 ? 'forward ▶' : '◀ reverse';
  }
  const lead = sel.cars[0].holder.position;
  marker.position.set(lead.x, 7.5 + Math.sin(time * 3) * 0.5, lead.z);
  marker.rotation.y = time * 1.5;
  marker.visible = !riding && !touring;
  for (const m of movers) m.update(dt, time);
  if (touring) tourCamera(dt); else if (riding) rideCamera(dt); else controls.update();
  // the near plane follows the zoom: close-ups can get right in, and the overview keeps its depth precision
  const near = riding ? 0.3 : THREE.MathUtils.clamp(camera.position.distanceTo(touring ? tourNow.look : controls.target) * 0.015, 0.05, 4);
  if (Math.abs(near - camera.near) > 0.01) { camera.near = near; camera.updateProjectionMatrix(); }
  cutaway();
  look.update();
  tiltH.enabled = tiltV.enabled = tiltOn;
  const blur = riding ? TILT_BLUR * 0.6 : TILT_BLUR;
  tiltH.uniforms.amount.value = (blur * 1.6) / innerWidth; tiltV.uniforms.amount.value = (blur * 1.6) / innerHeight;
  tiltH.uniforms.r.value = tiltV.uniforms.r.value = riding ? 0.45 : 0.5;
  composer.render();
  requestAnimationFrame(frame);
}
window.__trains = { trains, loops, layout, room, look, camera, controls, scene, select, setThrottle, movers };   // for poking from the console
frame();
